<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcus — Personal Training</title>
<meta name="theme-color" content="#2E7D32">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Every third-party asset below loads without blocking the parser, and that is
     the whole point rather than a performance tweak. A render-blocking
     stylesheet also blocks the scripts after it, because a script may read
     computed style -- so with fonts.googleapis.com stalled (connected, never
     answering) app.js never ran, the static shell painted anyway, and nothing
     on the page responded to a tap. Measured 2026-08-31 in Chromium at
     360x697: dead for the whole 45s budget, `typeof switchTab === "undefined"`.
     sw.js bounds this from the second visit on; a worker cannot rescue the
     first one, which is the visit this markup has to survive on its own.
     media="print" is the standard trick: not applied at parse time, therefore
     not blocking, then switched to all once it has arrived. -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wght@10..144,400..700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__title">
    <span class="topbar__logo material-icons-round">fitness_center</span>
    <div>
      <div class="topbar__name">Marcus</div>
      <div class="topbar__sub">your personal trainer</div>
    </div>
  </div>
</header>

<main id="view" class="view"></main>

<button id="chatFab" class="fab" aria-label="Chat with Marcus">
  <span class="material-icons-round">chat</span>
</button>

<nav class="bottomnav">
  <button class="bottomnav__item is-active" data-tab="home">
    <span class="material-icons-round">home</span><span>Today</span>
  </button>
  <button class="bottomnav__item" data-tab="plan">
    <span class="material-icons-round">event_note</span><span>Plan</span>
  </button>
  <button class="bottomnav__item" data-tab="log">
    <span class="material-icons-round">add_task</span><span>Log</span>
  </button>
  <button class="bottomnav__item" data-tab="nutrition">
    <span class="material-icons-round">restaurant</span><span>Food</span>
  </button>
  <button class="bottomnav__item" data-tab="progress">
    <span class="material-icons-round">show_chart</span><span>Progress</span>
  </button>
</nav>

<div id="chatSheet" class="chat-sheet" hidden>
  <div class="chat-sheet__scrim"></div>
  <div class="chat-sheet__panel" role="dialog" aria-label="Chat with Marcus">
    <div class="chat-sheet__header">
      <span class="chat-avatar material-icons-round">fitness_center</span>
      <div class="chat-sheet__headertext">
        <div class="chat-sheet__title">Marcus</div>
        <div class="chat-sheet__status" id="chatStatus">online</div>
      </div>
      <button id="chatClose" class="icon-btn" aria-label="Close chat">
        <span class="material-icons-round">close</span>
      </button>
    </div>
    <div id="chatMessages" class="chat-sheet__messages"></div>
    <form id="chatForm" class="chat-sheet__input">
      <input id="chatInput" type="text" placeholder="Message Marcus…" autocomplete="off">
      <button type="submit" class="icon-btn icon-btn--filled" aria-label="Send">
        <span class="material-icons-round">send</span>
      </button>
    </form>
  </div>
</div>

<div id="updateBanner" class="update-banner" role="status" aria-live="polite" hidden>
  <span>A new version of Marcus is ready.</span>
  <button type="button" id="updateReload" class="update-banner__btn">Reload</button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<template id="tpl-log-exercise-row">
  <div class="exercise-row">
    <input class="ex-name" type="text" placeholder="Exercise">
    <input class="ex-sets" type="number" min="1" placeholder="Sets" value="3">
    <input class="ex-reps" type="number" min="1" placeholder="Reps" value="10">
    <input class="ex-weight" type="number" min="0" step="0.5" placeholder="kg">
    <button type="button" class="icon-btn ex-remove" aria-label="Remove exercise"><span class="material-icons-round">close</span></button>
  </div>
</template>

<!-- async, so a stalled CDN cannot stop app.js from ever executing. The Progress
     tab is the only thing that needs Chart, it checks for it, and this event is
     how it redraws itself if the library turns up after the tab is already open. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" async onload="window.dispatchEvent(new Event('chartjs-ready'))"></script>
<script src="app.js"></script>
</body>
</html>
